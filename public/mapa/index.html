<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sensores del Palacio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --texto:#17202c; --suave:#5f6b7a; --tenue:#8a95a3; --borde:#e3e7ee; --hover:#f1f4f8;
  --azul:#1044CD;
  --ok:#16a06a; --aviso:#e08a00; --mal:#d83f3f; --off:#7a8494; --dudoso:#7c5cd6; --infra:#3f5f8f;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1319; --panel:#171c24; --texto:#e8edf4; --suave:#a3aebd; --tenue:#7d8898; --borde:#273040; --hover:#1f2631; }}
:root[data-theme="dark"]{ --bg:#0f1319; --panel:#171c24; --texto:#e8edf4; --suave:#a3aebd; --tenue:#7d8898; --borde:#273040; --hover:#1f2631; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--texto);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:340px 1fr 360px;height:100vh}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:auto}
aside.izq{border-right:1px solid var(--borde)}
aside.der{border-left:1px solid var(--borde)}
.bloque{padding:18px 20px;border-bottom:1px solid var(--borde)}
.bloque:last-child{border-bottom:0}
h1{margin:0;font-size:18px;letter-spacing:-.01em}
.volver{font-size:12.5px;color:var(--suave);text-decoration:none;display:inline-flex;gap:4px;align-items:center;margin-bottom:10px}
.volver:hover{color:var(--azul)}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--suave);margin-top:4px}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--off)}
.vivo.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.titulo{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);margin:0 0 10px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cifra{border-radius:10px;background:var(--hover);padding:10px 10px 8px;text-align:left;border:0;cursor:pointer}
.cifra b{display:block;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cifra span{font-size:12px;color:var(--suave)}
.cifra.on{outline:2px solid var(--azul)}
.barra{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--borde);margin-top:12px}
.barra i{display:block;height:100%}
.leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--suave)}
.leyenda button{border:0;background:none;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--suave)}
.leyenda button.on{color:var(--texto);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tipo{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:10px;cursor:pointer}
.tipo:hover{background:var(--hover)}
.tipo.on{background:color-mix(in srgb,var(--azul) 9%,transparent)}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--hover);color:var(--texto)}
.ico svg{width:18px;height:18px}
.tipo b{font-weight:600;display:block}
.tipo small{color:var(--suave);font-size:12px;display:block;line-height:1.3}
.tipo .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tipo .mini{display:flex;gap:2px;margin-top:5px}
.tipo .mini i{width:7px;height:7px;border-radius:2px;display:block}
.lista{margin:4px 0 0 44px;display:flex;flex-direction:column}
.fila{display:flex;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.fila:hover{background:var(--hover)}
.fila small{color:var(--tenue);margin-left:auto;font-size:11.5px;white-space:nowrap}
#escena{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--panel) 70%,var(--bg)),var(--bg))}
#escena canvas{display:block;outline:none}
.mando{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
.seg{display:flex;background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:3px;box-shadow:var(--sombra)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--suave);white-space:nowrap}
.seg button.on{background:var(--azul);color:#fff}
.seg button:not(.on):hover{background:var(--hover);color:var(--texto)}
.etq{position:absolute;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.etq.planta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--texto);background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:4px 9px;box-shadow:var(--sombra);transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer}
.etq.planta span{color:var(--suave);font-weight:500;letter-spacing:0;text-transform:none;margin-left:6px}
.etq.sala{font-size:11.5px;font-weight:600;color:var(--suave);text-shadow:0 0 3px var(--panel),0 0 3px var(--panel)}
.etq.norte{font-size:12px;font-weight:700;color:var(--suave)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--borde);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--sombra);transform:translate(12px,-50%);display:none;white-space:nowrap}
.tip small{display:block;color:var(--suave)}
.ayuda{position:absolute;right:14px;top:12px;font-size:12px;color:var(--tenue)}
/* ficha */
.cab{display:flex;gap:12px;align-items:flex-start}
.cab .ico{width:44px;height:44px;border-radius:12px;color:#fff}
.cab .ico svg{width:22px;height:22px}
.cab h2{margin:0;font-size:17px;line-height:1.25}
.cab .sub{color:var(--suave);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;margin-top:12px}
.nota{margin-top:10px;font-size:13px;padding:9px 12px;border-radius:8px;background:var(--hover);border-left:3px solid var(--aviso)}
.valores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.valor{background:var(--hover);border-radius:10px;padding:10px 12px}
.valor span{font-size:12px;color:var(--suave);display:block}
.valor b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.valor b small{font-size:13px;font-weight:500;color:var(--suave);margin-left:3px}
.valor.ancho{grid-column:1/-1}
.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-top:4px}
.datos div:nth-child(odd){color:var(--suave)}
details{margin-top:14px;border-top:1px solid var(--borde);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--suave)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
td,th{padding:4px 2px;border-bottom:1px solid var(--borde);text-align:left}
th{color:var(--tenue);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.planta-card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;border:1px solid var(--borde);background:none;border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;margin-bottom:8px}
.planta-card:hover{background:var(--hover)}
.planta-card b{font-weight:600}
.planta-card .n{font-weight:700;font-variant-numeric:tabular-nums}
.planta-card .barra{grid-column:1/-1;margin-top:6px;height:6px}
.planta-card small{grid-column:1/-1;color:var(--suave);font-size:12px}
.pie{font-size:11.5px;color:var(--tenue);line-height:1.5}
.pie a{color:inherit}
.cerrar{border:0;background:var(--hover);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;margin-bottom:12px}
@media (max-width:1100px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 70vh auto;height:auto}
  aside{overflow:visible}
  .ayuda{display:none}
}
</style>
</head>

  {k:"Planta Baja", n:0, nombre:"Planta Baja"}, {k:"Sótano", n:-1, nombre:"Sótano"}
];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const col = s => css(ESTADOS[s.estado].c);
const sensores = () => SENSORES.filter(s => s.estado !== "infra");
const num = (v, d=1) => typeof v === "number" ? v.toLocaleString("es-ES",{maximumFractionDigits:d}) : (v ?? "—");

let filtro = {tipo:null, estado:null, planta:null};
let sel = null, hover = null;
const coincide = s => (!filtro.tipo || s.tipo === filtro.tipo) &&
  (!filtro.estado || (filtro.estado === "problema" ? PROBLEMA.includes(s.estado) : s.estado === filtro.estado));

/* ================= panel izquierdo ================= */
function barra(lista, el){
  const n = lista.length || 1;
  el.innerHTML = ["ok",...PROBLEMA].map(k => { const c = lista.filter(s => s.estado===k).length;
    return c ? `<i style="width:${c/n*100}%;background:${css(ESTADOS[k].c)}" title="${ESTADOS[k].t}: ${c}"></i>` : ""; }).join("");
}
function pintarIzq(){
  const S = sensores(), ok = S.filter(s => s.estado==="ok").length, mal = S.length - ok;
  const cif = (k, v, t, c) => `<button class="cifra${filtro.estado===k?" on":""}" data-e="${k}"><b style="${c?`color:${c}`:""}">${v}</b><span>${t}</span></button>`;
  document.getElementById("cifras").innerHTML = cif("", S.length, "sensores") + cif("ok", ok, "funcionan bien", css("--ok")) + cif("problema", mal, "con problemas", css("--mal"));
  document.querySelectorAll(".cifra").forEach(b => b.onclick = () => { filtro.estado = (b.dataset.e && filtro.estado !== b.dataset.e) ? b.dataset.e : null; actualizar(); });
  barra(S, document.getElementById("barra"));
  document.getElementById("leyenda").innerHTML = ["ok",...PROBLEMA].map(k => `<button class="${filtro.estado===k?"on":""}" data-e="${k}"><i class="dot" style="background:${css(ESTADOS[k].c)}"></i>${ESTADOS[k].t} ${S.filter(s=>s.estado===k).length}</button>`).join("");
  document.querySelectorAll(".leyenda button").forEach(b => b.onclick = () => { filtro.estado = filtro.estado===b.dataset.e ? null : b.dataset.e; actualizar(); });

  document.getElementById("tipos").innerHTML = TIPOS.map(t => {
    const de = SENSORES.filter(s => s.tipo===t.t); if (!de.length) return "";
    const on = filtro.tipo === t.t;
    const mini = de.map(s => `<i style="background:${col(s)}"></i>`).join("");
    const lista = on ? `<div class="lista">${de.sort((a,b)=>a.planta.localeCompare(b.planta)||a.alias.localeCompare(b.alias)).map(s =>
      `<button class="fila" data-s="${s.serie}"><i class="dot" style="background:${col(s)}"></i>${s.alias}<small>${s.codigo||""} · ${s.planta}</small></button>`).join("")}</div>` : "";
    return `<button class="tipo${on?" on":""}" data-t="${t.t}"><span class="ico">${svg(t.ico)}</span><span><b>${t.t}</b><small>${t.que}</small><span class="mini">${mini}</span></span><span class="n">${de.length}</span></button>${lista}`;
  }).join("");
  document.querySelectorAll(".tipo").forEach(b => b.onclick = () => { filtro.tipo = filtro.tipo===b.dataset.t ? null : b.dataset.t; actualizar(); });
  document.querySelectorAll(".fila").forEach(b => b.onclick = () => elegir(SENSORES.find(s => s.serie===b.dataset.s), true));
}

/* ================= panel derecho ================= */
function lecturaPrincipal(s){
  const t = TIPO[s.tipo], out = [];
  (t?.lect || []).forEach(c => { const l = s.lecturas.find(l => l.c===c); if (l && !out.some(o => o.n===l.n)) out.push(l); });
  return out.slice(0, 4);
}
function etiquetaValor(s, l){
  if (l.c === "Contact_status") return {n:"Estado de la puerta", v: l.v===1 ? "Abierta" : l.v===0 ? "Cerrada" : num(l.v), u:"", nota:"1 = abierta, 0 = cerrada (sin confirmar por Nealis)"};
  if (l.c === "COUNTER_IN01") return {n:"Entradas acumuladas", v:num(l.v,0), u:"", nota:"desde la instalación"};
  if (l.c === "COUNTER_OUT01") return {n:"Salidas acumuladas", v:num(l.v,0), u:"", nota:"desde la instalación"};
  if (l.c === "CURRENT_VOLUME") return {n:"Lectura del contador", v:num(l.v,0), u:"L"};
  return {n:l.n, v:num(l.v), u:l.u};
}
function pintarDer(){
  const el = document.getElementById("der");
  if (!sel){
    const S = sensores();
    el.innerHTML = `<div class="bloque"><p class="titulo">Por planta</p>${PLANTAS.map(p => {

      <div class="bloque pie">Posiciones: planos de instalación de Nealis (26-06-2026), ajustados al edificio del Catastro (parcela 9623103UF2492S) por AMMA. Estado de cada sensor revisado el 9-11-2026; los datos se actualizan en vivo cada 5 minutos. Unidades añadidas por AMMA: la plataforma no publica ninguna.</div>`;

    <span class="pill" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}"><i class="dot" style="background:${c}"></i>${e.t}</span>

      <div style="font-size:12px;color:var(--tenue);margin-top:6px">Último dato: ${s.ultimo}</div>` : ""}

      <div>EUI (radio)</div><div>${s.eui||s.serie}</div><div>Nº de serie</div><div>${s.nserie||"—"}</div>
      <div>Envía datos</div><div>${s.frecuencia}</div></div>
      ${s.lecturas.length ? `<table><tr><th>Medida</th><th class="n">Última</th><th class="n">Mín.</th><th class="n">Máx.</th></tr>
      ${s.lecturas.map(l=>`<tr><td>${l.n}</td><td class="n">${num(l.v,2)} ${l.u}</td><td class="n">${num(l.min)}</td><td class="n">${num(l.max)}</td></tr>`).join("")}</table>
      <div style="font-size:11.5px;color:var(--tenue);margin-top:6px">Mínimo y máximo: del 27-10 al 3-11-2026.</div>` : ""}
    </details></div>`;
  document.getElementById("cerrar").onclick = () => { sel = null; actualizar(); };
}

/* ================= escena 3D ================= */
const cont = document.getElementById("escena");
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); cont.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(32, 1, 1, 3000);
const controles = new THREE.OrbitControls(camara, renderer.domElement);
controles.enableDamping = true; controles.maxPolarAngle = Math.PI*0.47; controles.minDistance = 30; controles.maxDistance = 520;
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa6b8, 0.75));
const sol = new THREE.DirectionalLight(0xffffff, 0.75); sol.position.set(-80, 160, 120); scene.add(sol);

const H = 5, SEP = 17;        // metros por planta; separación en la vista de maqueta
let separar = 1, separarObj = 1;
const yNivel = n => n * (H + separar * (SEP - H));
const forma = a => { const s = new THREE.Shape(); a.forEach(([x,y],i) => i ? s.lineTo(x,y) : s.moveTo(x,y)); return s; };
function placa(anillo, alto, mat){
  const g = new THREE.ExtrudeGeometry(forma(anillo), {depth:alto, bevelEnabled:false});
  g.rotateX(-Math.PI/2); return new THREE.Mesh(g, mat);
}
const oscuro = matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";
const C = oscuro ? {losa:0x2a3240, borde:0x4a5568, sala:0x40557a, paso:0x34404f, otro:0x2f3744} : {losa:0xfbfcfe, borde:0xa9b5c5, sala:0xc4d3ee, paso:0xe8edf4, otro:0xdde2e9};

const niveles = {};
PLANTAS.forEach(p => { const g = new THREE.Group(); g.userData = {p, objs:[]}; scene.add(g); niveles[p.k] = g; });
const partes = EDIFICIO.partes;
const huella = {
  "Sótano": partes.filter(p => p.bajo >= 1),
  "Planta Baja": partes,
  "Planta 1": partes.filter(p => p.sobre >= 2),
  "Cubierta": partes
};
const fades = [];   // materiales que se atenúan cuando se mira otra planta
Object.entries(huella).forEach(([k, ps]) => {
  const g = niveles[k];
  ps.forEach(p => p.anillos.forEach(a => {
    const mat = new THREE.MeshLambertMaterial({color:C.losa, transparent:true, opacity:k==="Cubierta"?0.55:0.96});
    const m = placa(a, 1.2, mat); m.position.y = -1.2; g.add(m);
    const lm = new THREE.LineBasicMaterial({color:C.borde, transparent:true, opacity:0.9});
    const b = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 40), lm); b.position.y = -1.2; g.add(b);
    fades.push({g, mat, base:mat.opacity}, {g, mat:lm, base:0.9});
  }));
});
// Salas: volúmenes bajos, un solo tono por tipo de espacio
const etiquetas = [];
SALAS.forEach(z => {
  const g = niveles[z.planta];
  const mat = new THREE.MeshLambertMaterial({color:C[z.tipo], transparent:true, opacity:0.9});
  const m = placa(z.poly, z.tipo==="sala" ? 1.6 : 0.4, mat); m.position.y = 0.01; g.add(m);
  fades.push({g, mat, base:0.9});
  const lm = new THREE.LineBasicMaterial({color:C.borde, transparent:true, opacity:0.7});
  const b = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 40), lm); b.position.copy(m.position); g.add(b);
  fades.push({g, mat:lm, base:0.7});
  const cx = z.poly.reduce((a,p)=>a+p[0],0)/4, cy = z.poly.reduce((a,p)=>a+p[1],0)/4;
  const el = document.createElement("div"); el.className = "etq sala"; el.textContent = z.nombre; cont.appendChild(el);
  etiquetas.push({el, g, local:new THREE.Vector3(cx, 1.6, -cy), sala:true, planta:z.planta});
});
// Planos originales de Nealis (opcionales)
const planos = [];
const cargador = new THREE.TextureLoader();
[["pb","Planta Baja"],["p1","Planta 1"]].forEach(([k, planta]) => {
  const pl = POS.planos[k];
  const v = pl.c.map(([e,n]) => [e, 0.06, -n]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute([...v[0],...v[1],...v[2], ...v[0],...v[2],...v[3]], 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute([0,1, 1,1, 1,0, 0,1, 1,0, 0,0], 2));
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:cargador.load(pl.img), transparent:true, opacity:0.75, depthWrite:false, side:THREE.DoubleSide}));
  m.visible = false; m.renderOrder = 1; niveles[planta].add(m); planos.push(m);
});
// Rótulo de cada planta
PLANTAS.forEach(p => {
  const el = document.createElement("div"); el.className = "etq planta"; cont.appendChild(el);
  el.onclick = () => verPlanta(p.k);
  etiquetas.push({el, g:niveles[p.k], local:new THREE.Vector3(-30, -0.6, 46), planta:p.k, rotulo:true});
});
{ const el = document.createElement("div"); el.className = "etq norte"; el.textContent = "N ↑"; cont.appendChild(el);
  etiquetas.push({el, g:niveles["Planta Baja"], local:new THREE.Vector3(0, 0, -54), norte:true}); }

// Sensores: icono que siempre mira a la cámara, color = estado
function textura(s, activo){
  const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  const color = col(s);
  x.beginPath(); x.arc(64, 64, 52, 0, Math.PI*2); x.fillStyle = color; x.fill();
  x.lineWidth = 8; x.strokeStyle = activo ? (oscuro ? "#ffffff" : "#17202c") : "#ffffff"; x.stroke();
  if (s.aprox){ x.setLineDash([10,9]); x.lineWidth = 5; x.strokeStyle = color; x.beginPath(); x.arc(64,64,61,0,Math.PI*2); x.stroke(); x.setLineDash([]); }
  x.save(); x.translate(64-30, 64-30); x.scale(60/24, 60/24);
  x.strokeStyle = "#fff"; x.lineWidth = 2.2; x.lineCap = "round"; x.lineJoin = "round";
  const tmp = document.createElement("div"); tmp.innerHTML = svg(TIPO[s.tipo].ico);
  tmp.querySelectorAll("path,circle").forEach(n => {
    if (n.tagName === "circle") { x.beginPath(); x.arc(+n.getAttribute("cx"), +n.getAttribute("cy"), +n.getAttribute("r"), 0, Math.PI*2); x.stroke(); }
    else x.stroke(new Path2D(n.getAttribute("d")));
  });
  x.restore();
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
const marcas = [];
SENSORES.forEach(s => {
  const g = niveles[s.planta]; const [x, y] = s.pos;
  const alto = 3.2;
  const mat = new THREE.SpriteMaterial({map:textura(s, false), sizeAttenuation:false, depthTest:false, transparent:true});
  const sp = new THREE.Sprite(mat); sp.position.set(x, alto, -y); sp.renderOrder = 10; sp.userData.s = s; g.add(sp);
  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x, 0.05, -y), new THREE.Vector3(x, alto, -y)]);
  const lm = new THREE.LineBasicMaterial({color:new THREE.Color(col(s)), transparent:true});
  const linea = new THREE.Line(lg, lm); g.add(linea);
  const pie = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20), new THREE.MeshBasicMaterial({color:new THREE.Color(col(s)), transparent:true}));
  pie.rotation.x = -Math.PI/2; pie.position.set(x, 0.08, -y); g.add(pie);
  marcas.push({s, sp, linea, pie});
});
function refrescarMarcas(){
  marcas.forEach(m => {
    const deOtra = filtro.planta && m.s.planta !== filtro.planta;
    m.sp.visible = m.linea.visible = m.pie.visible = !deOtra;
    const vis = coincide(m.s) && !deOtra;
    const a = vis ? 1 : 0.14;
    m.sp.material.opacity = a; m.linea.material.opacity = vis ? 0.9 : 0.1; m.pie.material.opacity = vis ? 0.9 : 0.1;
    const activo = m.s === sel || m.s === hover;
    if (m.activo !== activo || m.color !== m.s.estado){ m.sp.material.map.dispose(); m.sp.material.map = textura(m.s, activo); m.sp.material.needsUpdate = true; m.activo = activo; m.color = m.s.estado;
      m.linea.material.color.set(col(m.s)); m.pie.material.color.set(col(m.s)); }
    const k = (m.s === sel ? 0.046 : m.s === hover ? 0.036 : 0.028);
    m.sp.scale.set(k, k, 1);
  });
}

/* ---------- cámara ---------- */
let vuelo = null;
function volar(pos, obj, ms = 900){
  vuelo = {p0:camara.position.clone(), t0:controles.target.clone(), p1:pos, t1:obj, ini:performance.now(), ms};
}
function encuadre(){
  if (filtro.planta){
    const n = PLANTAS.find(p => p.k===filtro.planta).n, y = yNivel(n);
    volar(new THREE.Vector3(55, y + 125, 105), new THREE.Vector3(2, y - 6, -2));
  } else {
    const y = yNivel(0.5);
    volar(new THREE.Vector3(130, y + 95 + separarObj*25, 150), new THREE.Vector3(4, y - 2, 0));
  }
}
function verPlanta(k){ filtro.planta = filtro.planta === k ? null : k; actualizar(); encuadre(); }
function elegir(s, desdeLista){
  sel = (sel === s && !desdeLista) ? null : s;
  if (sel){
    if (filtro.planta && filtro.planta !== sel.planta) filtro.planta = sel.planta;
    const n = PLANTAS.find(p => p.k===sel.planta).n, y = yNivel(n);
    const obj = new THREE.Vector3(sel.pos[0], y + 2, -sel.pos[1]);
    const dir = camara.position.clone().sub(controles.target).normalize().multiplyScalar(85);
    volar(obj.clone().add(dir), obj);
  }
  actualizar();
}

/* ---------- mandos ---------- */
function pintarMandos(){
  const pl = document.getElementById("plantas");
  pl.innerHTML = [`<button class="${!filtro.planta?"on":""}" data-p="">Todo el edificio</button>`, ...PLANTAS.slice().reverse().reverse().map(p => `<button class="${filtro.planta===p.k?"on":""}" data-p="${p.k}">${p.nombre}</button>`)].join("");
  pl.querySelectorAll("button").forEach(b => b.onclick = () => { filtro.planta = b.dataset.p || null; actualizar(); encuadre(); });
  const vi = document.getElementById("vista");
  vi.innerHTML = `<button class="${separarObj?"on":""}" data-v="sep">Plantas separadas</button><button class="${planos[0].visible?"on":""}" data-v="plano">Plano de Nealis</button>`;
  vi.querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.v === "sep"){ separarObj = separarObj ? 0 : 1; }
    else planos.forEach(p => p.visible = !p.visible);
    pintarMandos(); setTimeout(encuadre, 50);
  });
}

function actualizar(){
  pintarIzq(); pintarDer(); pintarMandos(); refrescarMarcas();
  // En una planta concreta: las de encima se ocultan y las de debajo quedan como sombra
  const nSel = filtro.planta ? PLANTAS.find(p => p.k===filtro.planta).n : 99;
  PLANTAS.forEach(p => niveles[p.k].visible = p.n <= nSel);
  fades.forEach(f => { const on = !filtro.planta || f.g.userData.p.k === filtro.planta; f.mat.opacity = on ? f.base : f.base * 0.15; });
}

/* ---------- interacción ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const tip = document.getElementById("tip");
function tocado(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camara);
  const vis = marcas.filter(m => m.sp.material.opacity > 0.5).map(m => m.sp);
  return ray.intersectObjects(vis)[0]?.object.userData.s || null;
}
renderer.domElement.addEventListener("pointermove", e => {
  const s = tocado(e);
  if (s !== hover){ hover = s; refrescarMarcas(); renderer.domElement.style.cursor = s ? "pointer" : ""; }
  if (s){ const r = cont.getBoundingClientRect(); tip.style.display = "block"; tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px";
    tip.innerHTML = `<b>${s.alias}</b><small>${ESTADOS[s.estado].t}${s.codigo ? " · " + s.codigo : ""}</small>`; }
  else tip.style.display = "none";
});
let abajo = null;
renderer.domElement.addEventListener("pointerdown", e => abajo = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!abajo || Math.hypot(e.clientX-abajo[0], e.clientY-abajo[1]) > 5) return;
  const s = tocado(e); if (s) elegir(s); else if (sel){ sel = null; actualizar(); }
});
addEventListener("keydown", e => { if (e.key === "Escape" && sel){ sel = null; actualizar(); } });

function tam(){ const r = cont.getBoundingClientRect(); renderer.setSize(r.width, r.height); camara.aspect = r.width / r.height; camara.updateProjectionMatrix(); }
addEventListener("resize", tam); tam();
camara.position.set(150, 160, 175); controles.target.set(0, 8, 0);

const v = new THREE.Vector3();
(function bucle(t){
  requestAnimationFrame(bucle);
  // transición entre plantas juntas y separadas
  separar += (separarObj - separar) * 0.12;
  PLANTAS.forEach(p => niveles[p.k].position.y = yNivel(p.n));
  if (vuelo){
    const k = Math.min(1, (performance.now() - vuelo.ini) / vuelo.ms), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    camara.position.lerpVectors(vuelo.p0, vuelo.p1, e); controles.target.lerpVectors(vuelo.t0, vuelo.t1, e);
    if (k >= 1) vuelo = null;
  }
  controles.update(); renderer.render(scene, camara);
  const r = cont.getBoundingClientRect();
  etiquetas.forEach(q => {
    let on = true;
    if (q.sala) on = filtro.planta === q.planta;
    if (q.rotulo){ on = !filtro.planta;
      const de = sensores().filter(s => s.planta===q.planta).length;
      q.el.innerHTML = `${q.planta}<span>${de} sensor${de===1?"":"es"}</span>`; }
    v.copy(q.local); q.g.localToWorld(v); v.project(camara);
    const dentro = on && v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05;
    q.el.style.display = dentro ? "block" : "none";
    if (dentro){ q.el.style.left = ((v.x+1)/2*r.width) + "px"; q.el.style.top = ((1-v.y)/2*r.height) + "px"; }
  });
})();

/* ================= datos en vivo ================= */
const OCULTAR = /SOUND_P|SOUND_MIN|BOARD_VOLTAGE|DELTA_VOLUME|LOG_|CURRENT_TIME|STATUS|ESTIMATED|HOURLY|DAILY|PARTIAL/;
async function enVivo(){
  const ind = document.getElementById("vivo");
  try{
    const r = await fetch(`${VIVO.proxy}/v1/catalog/tenants/${VIVO.tenant}/organizations/${VIVO.org}/devices/${VIVO.device}`, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const medidas = (await r.json()).deviceMeasurements || [], ahora = Date.now();
    SENSORES.forEach(s => {
      if (s.estado === "infra") return;
      const ms = medidas.filter(m => (m.name||"").startsWith(s.serie) && !OCULTAR.test(m.name));
      let ult = 0;
      s.lecturas.forEach(l => {
        const m = ms.find(m => m.measurementType?.sensor === l.c); if (!m) return;
        const x = parseFloat(m.lastValueReported); if (Number.isFinite(x)) l.v = +x.toFixed(2);
        const t = Date.parse(String(m.dateLastValueReported).replace(" ","T")); if (t > ult) ult = t;
      });
      if (ult){
        s.ultimo = new Date(ult).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
        const limite = s.categoria === "WaterMeter" ? 18 : 3;   // el agua envía cada 8-16 h
        if ((ahora - ult) / 36e5 > limite){ s.estado = "off"; s.nota = `Sin señal desde el ${s.ultimo}.` + (s.notaFija ? ` ${s.notaFija}` : ""); }
        else { s.estado = s.estadoFijo === "off" ? "ok" : s.estadoFijo; s.nota = s.notaFija; }
      }
    });
    ind.classList.add("on"); ind.querySelector("span").textContent = "Datos en vivo · " + new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
    actualizar();
  }catch(e){
    ind.classList.remove("on"); ind.querySelector("span").textContent = "Sin conexión con la plataforma · estado revisado el 9-11-2026";
  }
}
actualizar(); encuadre();
if (VIVO.proxy){ enVivo(); setInterval(enVivo, 5 * 60000); }
</script>
